name: Pinned Lean verification
on:
  push:
    branches: [verify-18978-18980-pinned]
permissions:
  contents: read
concurrency:
  group: pinned-18971-18972-18978-18980
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out the verification commit
        run: |
          set -euo pipefail
          git init -q .
          git fetch --depth=1 --quiet "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          sh .github/scripts/install-elan.sh v4.4.0 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2 "$HOME/.elan" "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned Mathlib
        working-directory: lean
        run: lake exe cache get
      - name: Build the circuit definitions
        working-directory: lean
        run: lake build +PEqualNP.Defs
      - name: Check the triangle circuit
        working-directory: lean
        run: lake build +PEqualNP.Outside.L_meta_18972
      - name: Check the 3-colourability circuit
        if: ${{ !cancelled() }}
        working-directory: lean
        run: lake build +PEqualNP.Outside.L_meta_18971
      - name: Check the determinant lower bound
        if: ${{ !cancelled() }}
        working-directory: lean
        run: lake build +PEqualNP.Outside.L_meta_18978
      - name: Check the Hamiltonian-cycle lower bound
        if: ${{ !cancelled() }}
        working-directory: lean
        run: lake build +PEqualNP.Outside.L_meta_18980
